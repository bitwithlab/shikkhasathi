# ShikkhaSathi local stack.
#   Data services only (run backend + website from source):
#     docker compose -f infra/docker-compose.yml up -d db-core db-content redis meilisearch
#   Everything in containers (backend API + worker + website + Caddy on http://localhost:8000):
#     docker compose -f infra/docker-compose.yml --profile app up -d --build
# Volumes keep their previous names (core-data, content-data, meili-data), so existing data is kept.
name: shikkhasathi

x-backend: &backend
  build: { context: ../backend }
  env_file: [{ path: ../backend/.env, required: false }]
  environment: &backend-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    CORE_DATABASE_URL: postgres://postgres:postgres@db-core:5432/shikkhasathi_core
    CONTENT_DATABASE_URL: postgres://postgres:postgres@db-content:5432/shikkhasathi_content
    REDIS_URL: redis://redis:6379
    MEILI_HOST: http://meilisearch:7700
    MEILI_MASTER_KEY: dev-meili-master-key
    APP_URL: http://localhost:8000
    WEBSITE_INDEX_URL: http://website/index.html
    LOCAL_STORAGE_DIR: /app/storage-local
  volumes: [storage-local:/app/storage-local]
  depends_on:
    db-core: { condition: service_healthy }
    db-content: { condition: service_healthy }
    redis: { condition: service_healthy }
  profiles: [app]
  restart: unless-stopped

services:
  db-core:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: shikkhasathi_core }
    ports: ['5433:5432']
    volumes: [core-data:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }
  db-content:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: shikkhasathi_content }
    ports: ['5434:5432']
    volumes: [content-data:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, retries: 10 }
  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment: { MEILI_MASTER_KEY: dev-meili-master-key, MEILI_ENV: development }
    ports: ['7700:7700']
    volumes: [meili-data:/meili_data]
    healthcheck: { test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7700/health'], interval: 10s, retries: 10 }

  backend:
    <<: *backend
    environment: { <<: *backend-env, SS_ROLE: api }
    ports: ['8080:8080']
  worker:
    <<: *backend
    environment: { <<: *backend-env, SS_ROLE: worker, PORT: '8081' }
    healthcheck: { test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/actuator/health/readiness || exit 1'], interval: 15s, start_period: 60s, retries: 5 }
  website:
    build: { context: ../website }
    profiles: [app]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment: { SITE_ADDRESS: ':80', BACKEND: 'backend:8080', WEBSITE: 'website:80' }
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', caddy-data:/data]
    ports: ['8000:80']
    depends_on:
      backend: { condition: service_healthy }
      website: { condition: service_healthy }
    profiles: [app]
    restart: unless-stopped

volumes: { core-data: {}, content-data: {}, meili-data: {}, storage-local: {}, caddy-data: {} }
