    <script>
      // Apply saved theme before paint (no flash). Values: system | light | dark
      try {
        var t = localStorage.getItem('ss-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('ss-locale');
        if (l === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
