[versions]
kotlin = "2.2.21"
# Compose Multiplatform. Runtime/UI/foundation follow the CMP release; material3 has its own train.
compose = "1.9.3"
compose-material3 = "1.9.0"
androidx-lifecycle-cmp = "2.9.5"
androidx-navigation-cmp = "2.9.1"
lucide = "1.1.0"
ktor = "3.3.3"
koin = "4.1.1"
kotlinx-serialization = "1.9.0"
kotlinx-coroutines = "1.10.2"
# Asia/Dhaka day bucketing (calendar, week strip, due groups). 0.7.x uses kotlin.time.Instant/Clock.
kotlinx-datetime = "0.7.1"
# Android (resolved only when an Android SDK is present — see settings.gradle.kts)
agp = "8.12.0"
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"
androidx-activity-compose = "1.10.1"
androidx-core = "1.16.0"
androidx-profileinstaller = "1.4.1"
# Google Identity AuthorizationClient (Classroom server auth code)
play-services-auth = "21.3.0"
firebase-bom = "34.0.0"
# Lesson player (ExoMediaPlayer) — Android only, resolved on SDK machines.
media3 = "1.8.0"
# Baseline / startup profiles (:baselineprofile) — Android only.
androidx-baselineprofile = "1.4.1"
androidx-benchmark-macro = "1.4.1"
androidx-test-ext-junit = "1.3.0"
androidx-uiautomator = "2.3.0"
google-services = "4.4.3"
# Static analysis
ktlintGradle = "13.1.0"
ktlintCli = "1.7.1"
detekt = "1.23.8"

[libraries]
# --- headless (always compiled; runs on the JVM here) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# --- Compose UI (needs Google Maven for androidx.* transitive deps) ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle-cmp" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle-cmp" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation-cmp" }
lucide-icons = { module = "com.composables:icons-lucide", version.ref = "lucide" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# --- Android app ---
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
google-services-gradlePlugin = { module = "com.google.gms:google-services", version.ref = "google-services" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-baselineprofile-gradlePlugin = { module = "androidx.baselineprofile:androidx.baselineprofile.gradle.plugin", version.ref = "androidx-baselineprofile" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark-macro" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
