# Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Maven Central rate-limits bursts (HTTP 429); retry with backoff instead of failing the build.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# iOS targets are declared but can only be compiled on macOS; skip them quietly elsewhere.
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# ShikkhaSathi build switches (see settings.gradle.kts). Leave unset to auto-detect.
#ss.android=true
#ss.compose=true

# API base URL baked into builds (override per flavor / -Pss.apiBaseUrl=...).
ss.apiBaseUrl=https://shikkhasathi.com/api/v1
ss.apiBaseUrlDebug=http://10.0.2.2:8080/api/v1

# Google OAuth *Web* client id (same one the server uses) for the Classroom server auth code on Android.
# Set per environment, e.g. -Pss.googleServerClientId=1234-abc.apps.googleusercontent.com
ss.googleServerClientId=
